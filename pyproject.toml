[project]
name = "slocator-dashapp"
version = "0.1.0"
description = "Slocator Dash chat client for the Geospatial Intelligence MCP server"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.12",
    "dash>=3.2.0",
    "dash-bootstrap-components>=2.0.3",
    "httpx>=0.28.1",
    "langchain-core>=0.3.40",
    "langchain-google-genai>=2.0.9",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=0.3.30",
    "langgraph>=0.6.5",
    "markdown>=3.8.2",
    "pandas>=2.3.0",
    "pydantic>=1.8.2",
    "python-dotenv>=1.0.0",
    "slocator-models",
]

[project.scripts]
slocator = "slocator.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]